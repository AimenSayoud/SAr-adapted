[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insar-wetlands"
version = "1.0.0"
description = "Sentinel-1 C-band InSAR processing, data cube construction, and ground-truth evaluation over the Rzecin floating fen (Poland)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "rioxarray>=0.15",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "requests>=2.31",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Only needed to fetch new satellite/climate scenes (requires Earthdata / CDS credentials where applicable).
acquisition = [
    "asf-search>=6.7",
    "hyp3-sdk>=6.1",
    "cdsapi>=0.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
]
# Manuscript figures and workbooks: scientific colour maps, map scale bars, vector GIS, image compositing.
figures = [
    "cmcrameri>=1.8",
    "matplotlib-scalebar>=0.9",
    "adjustText>=1.4",
    "geopandas>=0.14",
    "pillow>=10.0",
    "openpyxl>=3.1",
]
dev = ["pytest>=7", "ruff>=0.1", "pytest-cov>=4"]
all = ["insar-wetlands[acquisition,figures,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/insar_wetlands"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter convention (100)
    "B008",   # function call in default argument where deliberate
    "E702",   # compact single-line semicolon statements in numerical scripts
    "E741",   # mathematical single-letter variable names
    "E731",   # concise lambda helper bindings
    "B007",   # unused loop counter variables
    "B905",   # zip() without strict=
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731"]
