# The register of everything that runs or has run (05_code/PLAN.md §2.2) — the public, technical half.
#
# One entry per notebook phase (historical, Colab), experiment (answers a ticket, writes a hub deliverable) or
# pipeline (makes data). Fields:
#   kind      phase | experiment | pipeline | colab
#   status    current (runnable, maintained) | finished (ran; result recorded) | superseded | open (planned) | removed
#   runs_on   mac | colab
#   code      path of the entry point at `code_ref` (HEAD = in the tree; a tag = removed from the tree, kept there)
#   command   how to run it from the repo root (make run E=<id> uses it)
#   inputs / outputs   catalog keys (root:path), cube layers (gold/…, silver/…) or hub paths
#   tickets / chains / tries   ids into the hub's ledger and tries map (what it found is there, not here)
#
# Findings never go here: this repo is public. The hub joins both halves into 05_code/REGISTER.md
# (scripts/execution_register.py), one card per entry with what it ran on and what it found.
