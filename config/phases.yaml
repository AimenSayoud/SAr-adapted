# The pipeline, declared.
#
# Why this file exists. Thirty-eight notebooks named phase01, phase01b, phase02,
# phase02b, phaseD, phaseDbis, phaseDter, phaseE, phaseE2 … The b / bis / ter
# suffixes are versioning-by-copy: a phase was re-run with a change and the old
# notebook kept. That instinct is right and the filename is the wrong place for
# it — nothing records what changed or which one is current. The README covered
# 14 of the 38, and the undocumented half is the half the paper's argument rests
# on (D behind H2, G behind H3, J the falsification appendix, L the round-2 gate).
#
# Everything a reader needs is here instead: what each phase asks, what it
# consumes, what it produces, whether it is still current, and which claim in the
# paper it supports.
#
# Fields
#   title       one line, English
#   notebook    path, relative to the repo root
#   group       which question domain the phase belongs to; also the directory
#               under notebooks/. Orthogonal to status: phaseC1 is exploratory
#               but sits with the inversions, and phaseC2 is superseded but sits
#               next to the phaseE2 that replaced it.
#   question    the falsifiable question the phase answers
#   status      current | superseded | exploratory | tooling
#   supersedes  phases this one replaces (the b / bis / ter relationships)
#   inputs      artefacts consumed; "<phase>.<name>" refers to another phase's output
#   outputs     artefacts produced, by filename
#   paper       where the result appears, or "-" if it does not
#
# Rules
#   * A phase with status: superseded is kept for provenance and must not be re-run.
#   * Adding a phase means adding an entry here, not inventing a new convention.
#   * A notebook lives in its group's directory; `make phases` fails if the
#     declaration and the filesystem disagree, which is how the flat layout of
#     38 files in no order would otherwise grow back.
#   * `make phases` validates this file and reports any phase whose inputs are missing.

phase01:
  title: Multi-source acquisition inventory
  notebook: notebooks/01_data/phase01_acquisition.ipynb
  group: data
  question: What Sentinel-1, Sentinel-2 and ERA5 data exist over the AOI and period?
  status: current
  inputs: []
  outputs: [s1_inventory.csv]
  paper: "§2.2, Table 2"

