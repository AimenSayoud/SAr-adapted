site:
  name: Rzecin peatland
  country: Poland
  aoi_geojson: data/aoi/Rzecin_corrected.geojson
  centroid:
  - 16.3098
  - 52.7632
  buffer_m: 500
time:
  # Default 3-year S1A-only reference window (2022-2024, 12-day repeat cycle).
  # Note: 6-day pairs exist in 2017-2021 (S1A+S1B) and 2025+ (S1A+S1C); multi-period
  # pipelines iterate over all periods in config/register.yaml.
  start: '2022-01-01'
  end: '2024-12-31'
sentinel1:
  flight_direction: ASCENDING
  relative_orbit: 175
  burst_id: 175_374052_IW1
  polarization: VV
  default_track: ascending
  tracks:
    ascending:
      flight_direction: ASCENDING
      relative_orbit: 175
      burst_id: '175_374052_IW1'
      subswath: IW1
      polarization: VV
      # Geometry measured from the HyP3 look vectors (lv_theta, lv_phi) over the AOI, Zone A
      # median (X-042, 2026-09-25); the range is min–max over the AOI crop.
      incidence_angle_deg: 32.26
      heading_deg: 348.6
      aoi_incidence_range_deg: [32.04, 32.48]
      overpass_utc: '16:36'
    descending:
      flight_direction: DESCENDING
      relative_orbit: 22
      burst_id: '022_045867_IW2'
      subswath: IW2
      polarization: VV
      # Measured like the ascending track (X-042). The former 34.10° / 193.6° lay outside
      # anything this burst can see over the AOI.
      incidence_angle_deg: 39.17
      heading_deg: 190.1
      aoi_incidence_range_deg: [38.99, 39.36]
      overpass_utc: '05:09'
sentinel2:
  collection: sentinel-2-l2a
  stac_url: https://earth-search.aws.element84.com/v1
  max_cloud_cover: 20
  bands:
  - green
  - nir
  - swir16
  - scl
  max_gap_days: 12
era5:
  dataset: reanalysis-era5-single-levels
  variables:
  - total_precipitation
  - 2m_temperature
  - total_column_water_vapour
  area:
  - 53.3
  - 15.8
  - 52.3
  - 16.8
hyp3:
  job_type: INSAR_ISCE_BURST
  looks: 10x2
  job_name_prefix: rzecin
  max_temporal_baseline_days: 48
  max_spatial_baseline_m: 150
  max_pairs_per_date: 4
  test_batch_size: 12
  crop_buffer_m: 2000
network:
  min_mean_coherence_pair: 0.3
  bridge_pairs_days:
  - 36
  - 48
quality_index:
  sbas_threshold: 0.5
annual_pairs:
  # Seasonal-annual pairing strategy (Ghezelayagh et al. 2024, Ecological Indicators):
  # compare acquisitions from the same spring month across years to minimise phenological
  # decorrelation without multi-season network inversion.
  target_month: 4          # mid-April: minimal canopy foliage and minimal snow/frost
  target_day: 15
  max_gap_years: 2         # include 2-year pairs as a rate-consistency check
  candidate_window_days: 19  # +/- 19 d pool around April 15 (covers 12-day S1A cycle offsets)
  pairs_per_transition: 3    # top-k pairs per annual transition -> ensemble median
  job_name: "rzecin_annual"

hybrid:
  # Hybrid short + annual network (following Hrysiewicz et al. 2024, RSE):
  # tests whether bridging winters with spring annual pairs stabilises SBAS inversion.
  job_name: "rzecin_hybrid"
  tropo: "era5_scalar"   # "era5_scalar" (baseline) | "gacos" (when .ztd grids are present)
  min_pairs: 3
  gamma_min: 0.20
isbas:
  min_coherent_pairs: 20
  gamma_min: 0.3
masking:
  ndwi_water_threshold: 0.2
  mndwi_water_threshold: 0.0
  sigma0_vv_water_db: -17.0
  double_bounce_delta_db: 4.0
classification:
  permanent_water_frac: 0.8
  intermittent_frac: 0.15
  stable_coherence: 0.45
products:
  subsidence_threshold_mm_yr: -2.0
  breathing_threshold_mm: 10.0
paths:
  outputs: outputs
  drive_data_root: /content/drive/MyDrive/insar_rzecin
