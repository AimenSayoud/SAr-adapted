name: CI

on:
  push:
    branches: ["main", "public-readiness"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: make lint RUFF="python -m ruff"

      - name: Execution register and protocol check
        run: make check

      - name: Synthetic scoring example
        run: make demo

      - name: Synthetic ground-truth test suite
        run: make test
